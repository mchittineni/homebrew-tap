# Keeps the SHA-pinned actions in .github/workflows current.
# Formulae are not dependencies in the Dependabot sense — they are regenerated
# by the upstream release pipeline.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
