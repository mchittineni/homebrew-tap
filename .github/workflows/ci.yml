name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  lint:
    name: Style and audit
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Set up Homebrew and tap this checkout
        id: brew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607

      - name: Show tap information
        run: |
          echo "Tap: ${{ steps.brew.outputs.tap-name }}"
          brew tap-info "${{ steps.brew.outputs.tap-name }}"

      - name: Brew style
        run: |
          brew style "${{ steps.brew.outputs.tap-name }}"

      - name: Brew audit
        run: |
          brew audit \
            --strict \
            --online \
            --tap "${{ steps.brew.outputs.tap-name }}"

  test:
    name: Install and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        os:
          - macos-latest
          - ubuntu-24.04

    steps:
      - name: Set up Homebrew and tap this checkout
        id: brew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607

      - name: List formulae
        id: formulae
        shell: bash
        run: |
          names="$(
            brew tap-info --json "${{ steps.brew.outputs.tap-name }}" |
            jq -r '.[0].formula_names[]' |
            tr '\n' ' '
          )"

          test -n "${names// /}" || {
            echo "::error::No formulae found in the tap"
            exit 1
          }

          echo "names=${names}" >> "$GITHUB_OUTPUT"
          echo "Formulae: ${names}"

      - name: Build from source
        run: |
          brew install \
            --build-from-source \
            --verbose \
            ${{ steps.formulae.outputs.names }}

      - name: Run formula tests
        run: |
          brew test \
            --verbose \
            ${{ steps.formulae.outputs.names }}

      - name: Verify tf-arch CLI
        run: |
          tf-arch --help

      - name: Show installed packages
        if: always()
        run: |
          brew list --versions \
            ${{ steps.formulae.outputs.names }} || true

  livecheck:
    name: Formulae track upstream

    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Set up Homebrew and tap this checkout
        id: brew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607

      - name: Brew livecheck
        run: |
          brew livecheck \
            --tap "${{ steps.brew.outputs.tap-name }}" \
            --json > livecheck.json

          jq -r '
            .[] |
            "\(.formula): \(.version.current) → \(.version.latest) (outdated: \(.version.outdated))"
          ' livecheck.json

          outdated="$(
            jq '[.[] | select(.version.outdated == true)] | length' \
              livecheck.json
          )"

          if [ "$outdated" != "0" ]; then
            echo "::error::$outdated formula(e) are behind upstream"
            exit 1
          fi